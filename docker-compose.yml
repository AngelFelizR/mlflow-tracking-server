name: mlflow-tracking-server

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2
    container_name: mlflow-server
    command:
      - sh
      - -c
      - |
        pip install --quiet psycopg2-binary boto3 &&
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
          --default-artifact-root /mlflow/artifacts \
          --app-name basic-auth
    environment:
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY}
      MLFLOW_AUTH_CONFIG_PATH: /app/basic_auth.ini
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
      - basic-auth-db:/data
      - ./basic_auth.ini:/app/basic_auth.ini:ro
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5000/health').status==200 else sys.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - mlflow-net

  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mlflow-net

volumes:
  postgres-data:
  mlflow-artifacts:
  basic-auth-db:

networks:
  mlflow-net:
    driver: bridge
