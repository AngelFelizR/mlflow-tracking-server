name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ~/mlflow-tracking-server
            git fetch origin main
            git reset --hard origin/main
            [ -f .env ] || { echo "❌ Falta .env"; exit 1; }
            [ -f basic_auth.ini ] || { echo "❌ Falta basic_auth.ini"; exit 1; }
            chmod +x scripts/*.sh
            
            # 1. Levantar contenedores
            docker compose up -d --remove-orphans
            
            # 2. Esperar a que MLflow esté healthy (copiado de tu deploy.sh)
            echo "⏳ Esperando a que MLflow esté healthy (max 3 min)..."
            TIMEOUT=180
            ELAPSED=0
            until [ "$(docker inspect -f '{{.State.Health.Status}}' mlflow-server 2>/dev/null)" = "healthy" ]; do
              sleep 3
              ELAPSED=$((ELAPSED + 3))
              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                echo "❌ MLflow no llegó a healthy en ${TIMEOUT}s"
                docker compose logs --tail=50 mlflow-server
                exit 1
              fi
            done
            echo "✅ MLflow healthy"
            
            # 3. Recargar Nginx
            echo "🔄 Recargando Nginx..."
            sudo systemctl reload nginx || sudo systemctl restart nginx
            
            # 4. Estado final
            docker compose ps
